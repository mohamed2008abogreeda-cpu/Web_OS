# ============================================================
# Cloudflare Workers — Web OS Portfolio
# ============================================================
# Build:   npm run build:worker    (runs `cloudflare` adapter)
# Preview: npm run preview:worker  (build + local wrangler dev)
# Deploy:  npm run deploy          (build + wrangler deploy)
# Secrets: wrangler secret put <NAME>
# ============================================================

name = "web-os-portfolio"
main = "worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ── Durable Objects (Native Edge WebSockets) ───────────────────
[durable_objects]
bindings = [
  { name = "SYNC_ROOM", class_name = "SyncRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["SyncRoom"]

# ── Non-sensitive environment variables ──────────────────
[vars]
NEXT_PUBLIC_PUSHER_CLUSTER = "us2"

# ── D1 Database (Active) ────────────────────────────
# To create production database, run: wrangler d1 create portfolio-db
# Then replace the database_id below with your generated ID.
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "d1-database-placeholder-id"

# ── R2 Object Storage (Active) ──────────────────────
# To create production R2 bucket, run: wrangler r2 bucket create portfolio-assets
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "portfolio-assets"

# ── Secrets (set via CLI, never committed) ───────────────
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put PUSHER_APP_ID
# wrangler secret put PUSHER_SECRET
# wrangler secret put DISCORD_WEBHOOK_URL

# ── KV Namespaces (Active) ──────────────────────────
[[kv_namespaces]]
binding = "GLOBAL_STATE"
id = "kv-global-state-placeholder-id"
